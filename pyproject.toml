[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "search-claim-audit"
version = "0.1.0"
description = "Offline audit of documented query-matching capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
search-claim-audit = "search_claim_audit:main"

[tool.setuptools.packages.find]
include = ["search_claim_audit*"]
